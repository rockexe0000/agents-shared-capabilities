name: tools-rs-release

# ADR 0008 Decision 2 + Phase 1g — treat capsync as a managed supply-chain object: build it
# reproducibly for every target we run on, publish a sha256 for each artifact, and attach a
# build-provenance attestation (the same governance ADR 0006 applies to EXTERNAL bins, applied
# to our own). Consumers (Phase 2 ephemeral init) fetch a pinned release + verify the sha256.
#
# Trigger: a `v*` tag (e.g. v0.1.0) or a manual dispatch. capsync is the repo's only
# release artifact, and the catalog is consumed by pinned git ref (ADR 0008 Decision 3) — not
# by a release version — so a repo-wide `v*` tag is unambiguous and ties the binary to the
# exact catalog it was built against. Namespace the tag only if a second artifact ever ships.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # create the release + upload assets
  id-token: write # OIDC for attestation
  attestations: write # actions/attest-build-provenance

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # static musl for linux (runs on any glibc/musl image — addresses the ADR 0008
          # debian-compat edge) — native runners, so no cross-linker gymnastics.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
          # macos (arm64 runner cross-builds the x86_64 slice from the same toolchain).
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: tools-rs
    steps:
      - uses: actions/checkout@v4
      # Pinned to rust-toolchain.toml's version; add the cross target for this job.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}
      - name: musl build deps
        if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      # --locked: build strictly from the committed Cargo.lock (reproducible).
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package + sha256
        run: |
          out="capsync-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/capsync" "$out"
          if command -v sha256sum >/dev/null 2>&1; then sha256sum "$out" > "$out.sha256"; else shasum -a 256 "$out" > "$out.sha256"; fi
          cat "$out.sha256"
      # Best-effort provenance. GitHub attestation is unavailable for USER-owned private repos
      # (works for public, or org-owned on Team+). Skip it there so the release still ships;
      # sha256 is the load-bearing verify for consumers (ADR 0006 treats no-attestation as an
      # explicit downgrade). It auto-enables if the repo becomes public / org-owned.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        continue-on-error: true
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: tools-rs/capsync-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: capsync-${{ matrix.target }}
          path: |
            tools-rs/capsync-${{ matrix.target }}
            tools-rs/capsync-${{ matrix.target }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Aggregate checksums
        run: |
          cd dist
          cat capsync-*.sha256 > SHA256SUMS
          echo "== SHA256SUMS =="; cat SHA256SUMS
      # gh CLI (no third-party action) — create the release if the tag pushed one, else upload.
      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            || gh release upload "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --clobber
