name: lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to match rust-toolchain.toml (ADR 0008 Decision 2 — reproducible build).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
      - name: Build capsync
        working-directory: tools-rs
        run: cargo build --release --quiet
      - name: Lint capability catalog
        run: tools-rs/target/release/capsync lint --catalog .
