name: tools-rs-parity

# ADR 0008 regression gate: `capsync` must keep rendering/checking/syncing/applying the catalog
# exactly as the committed golden expects. (The node `tools/` reference backend was retired once
# per-axis byte parity held, so the gate is now rust vs committed golden.) Runs on ubuntu-latest,
# which ships a C toolchain (the linker the Rust build needs).
on:
  push:
    branches: [main]
    paths: ['tools-rs/**']
  pull_request:
    paths: ['tools-rs/**']

jobs:
  parity:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools-rs
    steps:
      - uses: actions/checkout@v4
      # Pinned to match rust-toolchain.toml (ADR 0008 Decision 2 — reproducible build).
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - name: Format check
        run: cargo fmt --check
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test
      - name: Regression gate (rust vs committed golden)
        run: ./parity.sh
