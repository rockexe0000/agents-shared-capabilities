# Toolchain pin (ADR 0008 Decision 2 — the binary is a managed supply-chain object; its
# build must be reproducible). Phase 1g: pinned from the floating `stable` to an EXACT
# version so every build (dev / parity CI / cross-compiled release) uses one compiler.
# Bumping is a deliberate PR (like any pinned dependency). Cross targets are added per-job
# in the release workflow (kept out of here so the parity CI stays lean).
[toolchain]
channel = "1.98.1"
components = ["rustfmt", "clippy"]
