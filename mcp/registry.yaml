# host-agnostic MCP server registry(集體 catalog)
# 只放「定義」與 secret「參照」;真值不進 repo。個人專屬 server 放 agent-bot/{uid}/mcp/。
# schema:見 templates/mcp-server.template.yaml;投影器見 tools/projectors/。
servers:
  # ── 範例:stdio 本地 server ────────────────────────────────
  - name: example-fs
    transport: stdio
    command: npx
    args: ["-y", "@modelcontextprotocol/server-filesystem", "${WORKSPACE_DIR}"]
    env:
      # 值走參照(resolver 於本地取),永不寫真值:
      WORKSPACE_DIR: "env:WORKSPACE_DIR"
    capability:
      description: "read-only 檔案存取範例"
    source: "example (built-in)"
    pinned-ref: "n/a"

  # ── OAB MCP Facade(loopback;search_capabilities / execute_capability)──
  - name: oab
    transport: http
    url: "http://127.0.0.1:8848/mcp"
    capability:
      description: "OAB MCP Facade — 統一能力入口(loopback,信任邊界為 host/pod)"
    source: "openabdev/openab:docs/oab-mcp-facade.md"
    pinned-ref: "main"

  # ── GitHub via octobroker gateway(per-agent policy;上游注入 pooled 憑證)──
  - name: github
    transport: http
    url: "http://octobroker.${OCTOBROKER_NAMESPACE}:8080/mcp"
    headers:
      X-Octobroker-Key: "env:OCTOBROKER_KEY"
    capability:
      description: "GitHub 經 octobroker 閘道(agent 不持 GitHub 憑證;閘道注入)"
    source: "openabdev/octobroker"
    pinned-ref: "main"

  # ── 範例:remote http server(OAuth 由 runtime 本地處理)──────
  # - name: example-remote
  #   transport: http
  #   url: "https://mcp.example.com"
